# UC4 - Metabolic impact of nutrition.
# TOY DATA: ontology identifiers are real; studies and findings are invented.
#
# Deliberate test situations:
#  * inulin and high-fibre food increase butyrate-producing taxa        -> CQ01
#  * food -> taxon -> butyrate -> colorectal cancer chain               -> CQ02
#  * Bifidobacterium longum increases but has no metabolite record      -> chain stops (not in CQ01/CQ02)
#  * inulin raises propionate, but no taxon in the KG produces it       -> CQ03 gap analysis

studies:
  - id: micokg:study/UC4-A
    title: Toy inulin supplementation trial
    license: https://creativecommons.org/licenses/by/4.0/
    knowledge_source: infores:micokg-toy
  - id: micokg:study/UC4-B
    title: Toy literature-curated diet-microbiome-metabolite records
    knowledge_source: infores:micokg-toy

foods:
  - id: CHEBI:15443
    name: inulin
  - id: FOODON:03510048
    name: high fiber food
    food_component: [CHEBI:15443]

metabolites:
  - id: CHEBI:17968
    name: butyrate
  - id: CHEBI:17272
    name: propionate

diet_taxon_associations:
