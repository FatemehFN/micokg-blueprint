# UC3 - Host-microbiome interactions in cancer (reference use case).
# TOY DATA: identifiers of ontology terms are real, but studies, hosts,
# samples and all numbers are invented to exercise the competency questions.
#
# Deliberate test situations:
#  * Bacteroides fragilis has CONFLICTING findings (increased in study A stool,
#    decreased in study B tissue)                                   -> CQ3.2
#  * Escherichia coli -> colorectal cancer is coded with DOID:9256, reachable
#    only through mappings/curated/disease.sssom.tsv (DOID -> MONDO)  -> CQ3.1
#  * Fusobacterium nucleatum is linked to colorectal ADENOCARCINOMA,
#    a subclass of colorectal cancer (needs ontology slims)          -> CQ3.1
#  * colibactin (produced by E. coli pks+) has the CHEBI role genotoxin -> CQ3.3

studies:
  - id: micokg:study/UC3-A
    title: Toy faecal metagenomics case-control study of colorectal cancer
    creator: [ORCID:0000-0000-0000-0000]
    license: https://creativecommons.org/licenses/by/4.0/
    issued: "2025-03-01"
    knowledge_source: infores:micokg-toy
  - id: micokg:study/UC3-B
