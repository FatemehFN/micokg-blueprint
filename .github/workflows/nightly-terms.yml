name: Ontology term checks

# Slow, network-heavy checks kept out of PR CI:
#  - are the committed ontology slims still up to date with OLS?
#  - do ontology-valued slots use terms from the right ontology branch
#    (dynamic enums in schema/enums.yaml)?
on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC
  workflow_dispatch:

jobs:
  terms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,terms]"
      - name: Cache ontology downloads
        uses: actions/cache@v4
        with:
          path: ~/.data/oaklib
          key: oaklib-${{ runner.os }}
      - name: Rebuild slims and report drift
        run: |
          make slims
          git diff --stat --exit-code examples/ontology-slims || echo "::warning::ontology slims changed upstream; run 'make slims' and commit"
      - name: Validate terms against ontology branches
        run: make terms
