site_name: MiCoKnowGraph
site_description: Draft data model for a microbiome knowledge graph (BioHackathon Europe 2026, Project 16)
repo_url: https://github.com/FatemehFN/micokg-blueprint
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Getting started:
      - Onboarding: onboarding.md
      - Knowledge-graph primer: kg-primer.md
  - Design:
      - Modelling guide: modelling-guide.md
      - Use cases: use-cases.md
      - VERDANT integration: verdant-integration.md
      - Decisions:
          - "0001 Reified associations": adr/0001-association-reification.md
          - "0002 Identifiers and IRIs": adr/0002-identifier-policy.md
          - "0003 Ontology reuse": adr/0003-ontology-reuse.md
  - Schema reference: schema/index.md
