name: Mapping proposal
description: Propose a mapping between identifiers (SSSOM row)
title: "[Mapping] "
labels: ["mappings"]
body:
  - type: input
    id: subject
    attributes:
      label: Subject (CURIE and label)
      placeholder: "DOID:9256 colorectal cancer"
    validations:
      required: true
  - type: dropdown
    id: predicate
    attributes:
      label: Predicate
      options:
        - skos:exactMatch
        - skos:closeMatch
        - skos:broadMatch
        - skos:narrowMatch
        - skos:relatedMatch
    validations:
      required: true
  - type: input
    id: object
    attributes:
      label: Object (CURIE and label)
      placeholder: "MONDO:0005575 colorectal cancer"
    validations:
      required: true
  - type: dropdown
    id: justification
    attributes:
      label: Mapping justification
      options:
        - semapv:ManualMappingCuration
        - semapv:LexicalMatching
        - semapv:SemanticSimilarityThresholdMatching
        - semapv:MappingReview
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / rationale
  - type: input
    id: orcid
    attributes:
      label: Your ORCID
