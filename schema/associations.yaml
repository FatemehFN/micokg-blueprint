id: https://w3id.org/micokg/associations
name: micokg_associations
description: >-
  Reified associations (ADR-0001). Each claim is a node with rdf:subject,
  rdf:predicate and rdf:object plus context (direction, body site, environment,
  host), evidence (ECO) and provenance (source study, observations). This lets
  conflicting, context-dependent findings coexist. Direct subject-predicate-object
  "shortcut" triples are materialised separately by scripts/materialise_shortcuts.rq.
default_prefix: micokg
default_range: string
imports:
  - linkml:types
  - core
  - enums
  - samples_observations
  - provenance

classes:
  Association:
    is_a: NamedThing
    abstract: true
    description: A claim linking a subject to an object, with the context and evidence needed to interpret it.
    class_uri: micokg:Association
    exact_mappings: [biolink:Association]
    close_mappings: [sio:SIO_000897, rdf:Statement]
    slots:
      - subject
      - predicate
      - object
      - direction
      - effect_size
      - p_value
      - anatomical_context
      - environmental_context
      - host_context
      - has_evidence
      - source_study
      - derived_from
      - confidence
      - negated

  TaxonDiseaseAssociation:
    is_a: Association
    class_uri: micokg:TaxonDiseaseAssociation
    description: A taxon is reported as associated with (or contributing to) a disease.
    slot_usage:
      subject:
        pattern: "^(NCBITaxon:\\d+|GTDB:.+)$"
      predicate:
        pattern: "^RO:(0002610|0003302)$"
      object:
        pattern: "^(MONDO|DOID|NCIT|EFO):[A-Za-z0-9_]+$"

  TaxonHabitatAssociation:
    is_a: Association
    class_uri: micokg:TaxonHabitatAssociation
    description: A taxon is found in a habitat (ENVO term).
    slot_usage:
      subject:
        pattern: "^(NCBITaxon:\\d+|GTDB:.+)$"
      predicate:
        pattern: "^RO:0002303$"
      object:
        pattern: "^ENVO:\\d{8}$"

  TaxonHostAssociation:
    is_a: Association
    class_uri: micokg:TaxonHostAssociation
    description: A taxon has a host, or interacts with, another taxon.
    slot_usage:
      subject:
        pattern: "^(NCBITaxon:\\d+|GTDB:.+)$"
      predicate:
        pattern: "^RO:(0002454|0002437)$"
      object:
        pattern: "^NCBITaxon:\\d+$"

  TaxonMetaboliteAssociation:
    is_a: Association
    class_uri: micokg:TaxonMetaboliteAssociation
    description: RO:0002234 has output = produces; RO:0002233 has input = consumes.
    slot_usage:
      subject:
        pattern: "^(NCBITaxon:\\d+|GTDB:.+)$"
      predicate:
        pattern: "^RO:(0002234|0002233|0002610)$"
      object:
        pattern: "^CHEBI:\\d+$"

  DietTaxonAssociation:
    is_a: Association
    class_uri: micokg:DietTaxonAssociation
    description: A food or diet changes the abundance of a taxon.
    slot_usage:
      subject:
        pattern: "^(FOODON|CHEBI|NCIT|micokg):.+$"
      predicate:
        pattern: "^RO:0002610$"
      object:
        pattern: "^(NCBITaxon:\\d+|GTDB:.+)$"

  DietMetaboliteAssociation:
    is_a: Association
    class_uri: micokg:DietMetaboliteAssociation
    description: A food or diet changes the level of a metabolite.
    slot_usage:
      subject:
        pattern: "^(FOODON|CHEBI|NCIT|micokg):.+$"
      predicate:
        pattern: "^RO:0002610$"
      object:
        pattern: "^CHEBI:\\d+$"

  MetaboliteDiseaseAssociation:
    is_a: Association
    class_uri: micokg:MetaboliteDiseaseAssociation
    description: A metabolite is associated with, or contributes to, a disease.
    slot_usage:
      subject:
        pattern: "^CHEBI:\\d+$"
      predicate:
        pattern: "^RO:(0002610|0003302)$"
      object:
        pattern: "^(MONDO|DOID|NCIT|EFO):[A-Za-z0-9_]+$"

slots:
  subject:
    slot_uri: rdf:subject
    description: The entity the claim is about (its identifier).
    range: uriorcurie
    required: true
  predicate:
    slot_uri: rdf:predicate
    range: uriorcurie
    required: true
    description: >-
      Relation from RO. Allowed: RO:0002610 correlated with, RO:0003302 causes or
      contributes to condition, RO:0002234 has output, RO:0002233 has input,
      RO:0002303 has habitat, RO:0002454 has host, RO:0002437 biotically interacts with.
  object:
    slot_uri: rdf:object
    description: The entity the subject is linked to (its identifier).
    range: uriorcurie
    required: true
  direction:
    slot_uri: micokg:direction
    description: Whether the subject is increased, decreased, present or absent in the compared condition.
    range: DirectionEnum
  effect_size:
    slot_uri: micokg:effect_size
    description: Effect size as reported by the source, e.g. log2 fold change.
    range: float
  p_value:
    slot_uri: micokg:p_value
    description: P-value as reported by the source.
    range: float
    minimum_value: 0
    maximum_value: 1
  anatomical_context:
    slot_uri: micokg:anatomical_context
    description: Body site the claim applies to (UBERON).
    range: uriorcurie
    pattern: "^UBERON:\\d{7}$"
  environmental_context:
    slot_uri: micokg:environmental_context
    description: Environment the claim applies to (ENVO).
    range: uriorcurie
    pattern: "^ENVO:\\d{8}$"
  host_context:
    slot_uri: micokg:host_context
    description: Host taxon the claim applies to, e.g. NCBITaxon:9606 human.
    range: uriorcurie
    pattern: "^NCBITaxon:\\d+$"
  has_evidence:
    slot_uri: micokg:has_evidence
    description: Type of evidence behind the claim (ECO terms).
    range: uriorcurie
    multivalued: true
    pattern: "^ECO:\\d{7}$"
    bindings:
      - range: EvidenceEnum
        obligation_level: RECOMMENDED
  source_study:
    slot_uri: dct:source
    description: The study or resource the claim comes from.
    range: Study
    required: true
  derived_from:
    slot_uri: prov:wasDerivedFrom
    description: Observations the claim was derived from, if any.
    range: Observation
    multivalued: true
  confidence:
    slot_uri: micokg:confidence
    description: Confidence between 0 and 1. How it is calibrated is an open question.
    range: float
    minimum_value: 0
    maximum_value: 1
  negated:
    slot_uri: micokg:negated
    description: True when the source reports that the association was looked for and not found.
    range: boolean
