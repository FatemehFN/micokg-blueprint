name: Competency question
description: Propose a question the knowledge graph should be able to answer
title: "[CQ] "
labels: ["competency-question"]
body:
  - type: dropdown
    id: use_case
    attributes:
      label: Use case
      options:
        - UC1 Aeromicrobiome
        - UC2 AMR transmission
        - UC3 Host-microbiome in cancer
        - UC4 Nutrition
        - Other / cross-cutting
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Phrase it as a researcher would ask it.
      placeholder: Which taxa are reported as increased in colorectal cancer tumour tissue in at least two studies?
    validations:
      required: true
  - type: textarea
    id: entities
    attributes:
      label: Entities and context involved
      description: e.g. taxon, disease, body site, time, place, evidence type. Add ontology terms if you know them.
    validations:
      required: true
  - type: textarea
    id: example_answer
    attributes:
      label: Example answer
      description: A concrete answer from your domain knowledge, used to write toy data and expected results.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Real data sources
      description: Which existing resources could supply the data (MGnify, CARD, gutMDisorder, papers...)?
  - type: dropdown
    id: priority
    attributes:
      label: Priority for the hackathon
      options: [Must have, Nice to have, Future]
