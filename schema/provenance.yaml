id: https://w3id.org/micokg/provenance
name: micokg_provenance
description: Studies and datasets that samples and associations come from (DCTerms / PROV).
default_prefix: micokg
default_range: string
imports:
  - linkml:types
  - core

classes:
  Study:
    is_a: NamedThing
    class_uri: micokg:Study
    description: A study, dataset or resource that samples and claims come from.
    close_mappings: [OBI:0000066, schema:Dataset]
    slots:
      - title
      - creator
      - license
      - issued
      - references
      - knowledge_source

slots:
  title:
    slot_uri: dct:title
    description: Title of the study or dataset.
  creator:
    slot_uri: dct:creator
    range: uriorcurie
    multivalued: true
    description: ORCID identifiers.
  license:
    slot_uri: dct:license
    description: Licence URL of the source data.
    range: uri
  issued:
    slot_uri: dct:issued
    description: Publication or release date.
    range: date
  references:
    slot_uri: dct:references
    range: uriorcurie
    multivalued: true
    description: Publications (doi:, PMID:) describing the study.
  knowledge_source:
    slot_uri: micokg:knowledge_source
    range: uriorcurie
    description: Resource the record was ingested from, as an infores CURIE (e.g. infores:gutmdisorder).
