name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint, validate, generate, test
        run: make all
      - name: Upload build artefacts (OWL, SHACL, JSON-LD, RDF, SPARQL examples)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
