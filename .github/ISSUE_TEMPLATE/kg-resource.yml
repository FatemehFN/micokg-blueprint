name: KG / resource for the landscape
description: Add an existing knowledge graph, database or standard to landscape/
title: "[Landscape] "
labels: ["landscape"]
body:
  - type: input
    id: name
    attributes:
      label: Resource name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL (homepage, repository or paper)
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What does it cover (e.g. microbe-disease associations, AMR genes, metabolic models)?
    validations:
      required: true
  - type: textarea
    id: model
    attributes:
      label: Entities, relations and data model
      description: Main node/edge types; data model (Biolink, custom, relational...); format (RDF, KGX, TSV, Neo4j...).
  - type: input
    id: ontologies
    attributes:
      label: Ontologies / identifiers used
  - type: input
    id: licence
    attributes:
      label: Licence and access (download, API, SPARQL endpoint)
  - type: textarea
    id: reuse
    attributes:
      label: Notes on reuse for MiCoKnowGraph
