# UC2 - Antimicrobial resistance transmission (One Health).
# TOY DATA: ontology identifiers are real; studies, samples, gene records,
# dates and numbers are invented.
#
# Deliberate test situations:
#  * tet(M) and NDM-1 found in Barcelona waste water, then later in human stool in
#    Barcelona, each in a DIFFERENT host taxon                        -> CQ01, CQ02
#  * an NDM-1 human sample collected BEFORE the waste-water sample     -> must not appear in CQ01
#  * tet(M) on a chromosome in a pig sample (not mobile)               -> excluded from CQ02
#  * tet(M) detected in human, animal and environment compartments     -> CQ03

studies:
  - id: micokg:study/UC2-WW
    title: Toy waste-water resistome surveillance
    license: https://creativecommons.org/licenses/by/4.0/
    knowledge_source: infores:micokg-toy
  - id: micokg:study/UC2-CLIN
    title: Toy hospital patient gut resistome study
    knowledge_source: infores:micokg-toy
  - id: micokg:study/UC2-FARM
    title: Toy pig farm resistome study
    knowledge_source: infores:micokg-toy

hosts:
  - id: micokg:host/UC2-P01
    in_taxon: NCBITaxon:9606
  - id: micokg:host/UC2-P02
    in_taxon: NCBITaxon:9606
  - id: micokg:host/UC2-PIG01
    in_taxon: NCBITaxon:9823           # Sus scrofa

